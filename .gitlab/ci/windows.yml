.windows-msvc:
  tags: [saas-windows-medium-amd64]
  before_script:
    - |
      $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
      if (-not (Test-Path $vswhere)) { throw "vswhere not found at $vswhere" }

      $vsPath = & $vswhere -latest -products * `
        -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 `
        -property installationPath

      if (-not $vsPath) { throw "No VS install with VC x64 tools found" }

      Write-Host "Using VS at: $vsPath"
      Import-Module (Join-Path $vsPath 'Common7\Tools\Microsoft.VisualStudio.DevShell.dll')
      Enter-VsDevShell -VsInstallPath $vsPath -SkipAutomaticLocation -DevCmdArguments '-arch=x64 -host_arch=x64'

build:windows:
  extends: .windows-msvc
  stage: build
  script:
    - cmake -S . -B build -G "Visual Studio 17 2022" -A x64 -DCMAKE_BUILD_TYPE=Debug -DUVIM_BUILD_TESTS=ON -DUVIM_ENABLE_CLANGD_LSP=OFF
    - cmake --build build --config Debug
  artifacts:
    paths:
      - build/
    expire_in: 1 hour

test:windows:unit:
  extends: .windows-msvc
  stage: test
  needs: ["build:windows"]
  script:
    - New-Item -ItemType Directory -Force -Path build/Testing | Out-Null
    - ctest --test-dir build -C Debug --output-on-failure --output-junit Testing/junit.xml 2>&1 | Tee-Object -FilePath build/Testing/ctest.log
  artifacts:
    when: always
    paths:
      # Raw ctest stdout + per-test logs ctest writes under Testing/
      - build/Testing/
    reports:
      junit: build/Testing/junit.xml
    expire_in: 1 week

test:windows:robot:
  extends: .windows-msvc
  stage: test
  needs: ["build:windows"]
  # Robot tests use pexpect.spawn, which is POSIX-only. A Windows port via
  # `wexpect` (ConPTY-backed) is not yet wired up — keep the job to track
  # progress but don't fail the pipeline on it.
  allow_failure: true
  script:
    - python -m venv .venv
    - .\.venv\Scripts\Activate.ps1
    - python -m pip install --upgrade pip
    - python -m pip install -r tests/robot/requirements.txt
    - $env:UVIM_BIN = "$PWD\build\Debug\uvim.exe"
    - robot --outputdir tests/robot/output tests/robot
  artifacts:
    when: always
    paths:
      # output.xml, log.html, report.html, plus per-suite stdout
      - tests/robot/output/
    reports:
      junit: tests/robot/output/output.xml
    expire_in: 1 week

# ---------------------------------------------------------------------------
# Release: standalone .exe (Release config, statically linked C runtime)
# ---------------------------------------------------------------------------
# Runs only after the Windows unit tests pass. The robot job is allow_failure
# and is intentionally not in `needs:` so it doesn't gate releases.
#
# CMAKE_MSVC_RUNTIME_LIBRARY=MultiThreaded selects /MT (static CRT). We pass
# CMAKE_POLICY_DEFAULT_CMP0091=NEW so the variable takes effect even though
# CMakeLists.txt still uses cmake_minimum_required(VERSION 3.14).

release:windows:
  extends: .windows-msvc
  stage: release
  needs: ["test:windows:unit"]
  script:
    - cmake -S . -B build-release -G "Visual Studio 17 2022" -A x64
        -DCMAKE_BUILD_TYPE=Release
        -DUVIM_BUILD_TESTS=OFF
        -DUVIM_ENABLE_CLANGD_LSP=OFF
        -DCMAKE_POLICY_DEFAULT_CMP0091=NEW
        -DCMAKE_MSVC_RUNTIME_LIBRARY=MultiThreaded
    - cmake --build build-release --config Release
    - New-Item -ItemType Directory -Force -Path dist | Out-Null
    - Copy-Item build-release\Release\uvim.exe dist\uvim.exe
    # Sanity-check that the .exe has no DLL deps on the VC runtime.
    - 'dumpbin /DEPENDENTS dist\uvim.exe | Tee-Object -FilePath dist\dependents.txt'
    - |
      $bad = Select-String -Path dist\dependents.txt -Pattern '^\s*(VCRUNTIME|MSVCP|UCRTBASE)' -CaseSensitive:$false
      if ($bad) { throw "uvim.exe still depends on VC runtime DLLs:`n$($bad -join "`n")" }
  artifacts:
    name: "uvim-windows-x64-$CI_COMMIT_SHORT_SHA"
    paths:
      - dist/uvim.exe
      - dist/dependents.txt
    expire_in: 30 days
