.linux:
  image: ubuntu:24.04
  before_script:
    - apt-get update -qq
    - DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends build-essential cmake ninja-build git python3 python3-venv python3-pip ca-certificates file

build:linux:
  extends: .linux
  stage: build
  script:
    - cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Debug -DUVIM_BUILD_TESTS=ON -DUVIM_ENABLE_CLANGD_LSP=OFF
    - cmake --build build
  artifacts:
    paths:
      - build/
    expire_in: 1 hour

test:linux:unit:
  extends: .linux
  stage: test
  needs: ["build:linux"]
  script:
    - set -o pipefail
    - mkdir -p build/Testing
    - ctest --test-dir build --output-on-failure
        --output-junit Testing/junit.xml 2>&1
        | tee build/Testing/ctest.log
  artifacts:
    when: always
    paths:
      # Raw ctest stdout + the per-test logs ctest writes under Testing/
      - build/Testing/
    reports:
      junit: build/Testing/junit.xml
    expire_in: 1 week

test:linux:robot:
  extends: .linux
  stage: test
  needs: ["build:linux"]
  script:
    - python3 -m venv .venv
    - . .venv/bin/activate
    - python -m pip install --upgrade pip
    - python -m pip install -r tests/robot/requirements.txt
    - UVIM_BIN="$PWD/build/uvim" ./tests/robot/run_robot.sh tests/robot/
  artifacts:
    when: always
    paths:
      # output.xml, log.html, report.html, plus per-suite stdout
      - tests/robot/output/
    reports:
      junit: tests/robot/output/output.xml
    expire_in: 1 week

# ---------------------------------------------------------------------------
# Release: standalone Linux binary (Release config, fully static link)
# ---------------------------------------------------------------------------
# Gated on both test:linux:unit and test:linux:robot — only runs if both
# pass. Static linking via -static -static-libgcc -static-libstdc++ so the
# binary runs on any Linux without matching glibc or libstdc++ versions.
# Verified by `file` reporting "statically linked".

release:linux:
  extends: .linux
  stage: release
  needs: ["test:linux:unit", "test:linux:robot"]
  script:
    - cmake -S . -B build-release -G Ninja
        -DCMAKE_BUILD_TYPE=Release
        -DUVIM_BUILD_TESTS=OFF
        -DUVIM_ENABLE_CLANGD_LSP=OFF
        -DCMAKE_EXE_LINKER_FLAGS="-static -static-libgcc -static-libstdc++"
    - cmake --build build-release
    - mkdir -p dist
    - cp build-release/uvim dist/uvim
    - strip dist/uvim
    - file dist/uvim | tee dist/file-info.txt
    - |
      if ! grep -q "statically linked" dist/file-info.txt; then
        echo "ERROR: dist/uvim is not a fully static binary"
        exit 1
      fi
  artifacts:
    name: "uvim-linux-x64-$CI_COMMIT_SHORT_SHA"
    public: true  # anonymous download; requires Public project visibility
    paths:
      - dist/uvim
      - dist/file-info.txt
    expire_in: 30 days
