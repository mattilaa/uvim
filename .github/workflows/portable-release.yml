name: Portable release binaries

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Release tag to create or update (for example v0.3.1)"
        required: true
        type: string
      profile:
        description: "uvim-config feature profile"
        required: true
        default: full
        type: choice
        options:
          - full
          - basic
          - minimal
          - vi-min
          - vi-real
      publish:
        description: "Create/update the GitHub Release (off: only build the archives)"
        required: false
        default: true
        type: boolean

concurrency:
  group: portable-release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build:
    name: Build ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        # Release builds for every supported target (see README,
        # "Supported platforms and builds"); no debug builds here.
        include:
          - name: Linux x86_64 static
            runner: ubuntu-22.04
            artifact: release-linux-x86_64
            arguments: ""
          - name: Linux arm64 static
            runner: ubuntu-22.04-arm
            artifact: release-linux-arm64
            arguments: ""
          - name: macOS arm64
            runner: macos-15
            artifact: release-macos-arm64
            arguments: "--macos-arch arm64"
          - name: Windows x86_64
            runner: windows-latest
            artifact: release-windows-x86_64
            arguments: ""
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    env:
      UVIM_RELEASE_PROFILE: ${{ github.event_name == 'workflow_dispatch' && inputs.profile || 'full' }}
      UVIM_RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.release_tag || github.ref_name }}

    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Install Linux build tools
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --yes g++ libc6-dev ninja-build zip

      - name: Build portable archive
        if: runner.os != 'Windows'
        run: |
          ./scripts/build_portable.sh \
            --profile "$UVIM_RELEASE_PROFILE" \
            --version "$UVIM_RELEASE_TAG" \
            --archive-format zip \
            --jobs 3 \
            ${{ matrix.arguments }}

      - name: Build portable archive (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: >
          ./scripts/build_portable.ps1
          -Profile $env:UVIM_RELEASE_PROFILE
          -Version $env:UVIM_RELEASE_TAG
          -Jobs 4

      - name: Build Windows installer
        if: runner.os == 'Windows'
        shell: pwsh
        run: >
          ./scripts/build_windows_installer.ps1
          -Version $env:UVIM_RELEASE_TAG
          -Binary build-portable/Release/uvim.exe
          -OutputDir dist-installer
          -InstallInnoSetup

      - name: Upload Windows installer
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.artifact }}-installer
          path: |
            dist-installer/*.exe
            dist-installer/*.sha256
          if-no-files-found: error
          retention-days: 14

      - name: Build macOS installer package
        if: runner.os == 'macOS'
        run: |
          ./scripts/build_macos_pkg.sh \
            --binary build-portable/uvim \
            --version "$UVIM_RELEASE_TAG" \
            --output-dir dist

      - name: Upload portable archive
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.artifact }}
          path: |
            dist/*.zip
            dist/*.pkg
            dist/*.sha256
          if-no-files-found: error
          retention-days: 14

  release:
    name: Attach binaries to GitHub Release
    needs: build
    if: github.event_name == 'push' || inputs.publish
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.release_tag || github.ref_name }}

    steps:
      - name: Check out source (README.md for the release notes)
        uses: actions/checkout@v6

      - name: Download portable archives
        uses: actions/download-artifact@v8
        with:
          pattern: release-*
          path: release-assets
          merge-multiple: true

      - name: Create or update release
        run: |
          # Release notes: the "### <tag> ..." section of README.md's
          # "Release notes", with README-relative links made absolute.
          # Without such a section GitHub generates the notes.
          awk -v tag="### $RELEASE_TAG " \
            'index($0, tag) == 1 { on = 1; next }
             on && (/^### v/ || /^## /) { exit }
             on { print }' README.md |
            sed -E "s#\]\(\#([a-z0-9-]+)\)#](https://github.com/$GITHUB_REPOSITORY/blob/$RELEASE_TAG/README.md\#\1)#g" \
            > release-notes.md
          if [ -s release-notes.md ]; then
            notes=(--notes-file release-notes.md)
          else
            notes=(--generate-notes)
          fi
          if ! gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release create "$RELEASE_TAG" \
              --repo "$GITHUB_REPOSITORY" \
              --target "$GITHUB_SHA" \
              --title "uVim $RELEASE_TAG" \
              "${notes[@]}"
          elif [ -s release-notes.md ]; then
            gh release edit "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" \
              --notes-file release-notes.md
          fi
          gh release upload "$RELEASE_TAG" release-assets/* \
            --repo "$GITHUB_REPOSITORY" \
            --clobber
