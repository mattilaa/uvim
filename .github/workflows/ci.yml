name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

# New pushes to main cancel its previous run so CI tests the latest commit.
# Other branches queue one run at a time; later pushes replace the waiting run.
# Keep github.ref in the group: a push to dev must never cancel a main run,
# and a push to main must never cancel a run on another branch.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}

# A bare `cmake --build --parallel` means unlimited `make -j` with the
# Makefile generator (macOS) and exhausts the runner's memory; use a fixed
# job count for every generator instead.
env:
  CMAKE_BUILD_PARALLEL_LEVEL: "4"
  # Repository variable: false opts out; unset defaults to true.
  CI_REBASE_BRANCHES: ${{ vars.CI_REBASE_BRANCHES || 'true' }}

jobs:
  prepare:
    name: Prepare CI source
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Rebase branch onto current main and snapshot source
        shell: bash
        run: |
          # The rebase may update the script itself; execute a stable copy.
          cp scripts/ci_prepare_source.sh "$RUNNER_TEMP/ci_prepare_source.sh"
          bash "$RUNNER_TEMP/ci_prepare_source.sh" "$RUNNER_TEMP/ci-source.bundle"

      - name: Test source preparation
        shell: bash
        run: python3 -B tests/ci_prepare_source_test.py

      - name: Upload prepared source
        uses: actions/upload-artifact@v7
        with:
          name: ci-source
          path: ${{ runner.temp }}/ci-source.bundle
          if-no-files-found: error
          retention-days: 1

  # ===========================================================================
  # Build stage. All jobs run in parallel:
  #   build      Debug builds with tests, one per test target
  #   artifacts  Release builds of the binaries for the supported targets
  # Test stage (needs: build):
  #   test       runs the unit and Robot tests on the downloaded Debug builds
  # ===========================================================================
  build:
    name: build ${{ matrix.target }} (Debug)
    needs: prepare
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: linux-x64
            runner: ubuntu-latest
            configure: >-
              -G Ninja -DCMAKE_BUILD_TYPE=Debug -DCMAKE_CXX_COMPILER=g++
              -DUVIM_ENABLE_CLANGD_LSP=ON -DUVIM_ENABLE_CSHARP_LSP=ON
          - target: macos-arm64
            runner: macos-latest
            configure: >-
              -DCMAKE_BUILD_TYPE=Debug -DUVIM_ENABLE_CLANGD_LSP=OFF
          - target: macos-arm64-asan
            runner: macos-latest
            configure: >-
              -DCMAKE_BUILD_TYPE=Debug -DUVIM_ENABLE_CLANGD_LSP=OFF
              -DUVIM_ENABLE_SANITIZERS=ON
          - target: windows-x64
            runner: windows-latest
            configure: >-
              -A x64 -DUVIM_ENABLE_CLANGD_LSP=ON -DUVIM_ENABLE_CSHARP_LSP=ON
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Download prepared source
        uses: actions/download-artifact@v8
        with:
          name: ci-source
          path: ${{ runner.temp }}/ci-source

      - name: Use prepared source
        run: |
          git fetch --no-tags "$RUNNER_TEMP/ci-source/ci-source.bundle" HEAD
          git checkout --detach FETCH_HEAD

      - name: Install build tools (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --yes g++ ninja-build

      # Keep Python test registration consistent across the separate build
      # and test runners; avoid discovering a runner-image preview version.
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Configure (Debug)
        run: >-
          cmake -S . -B build -DUVIM_BUILD_TESTS=ON
          -DPython3_EXECUTABLE="$(python -c 'import sys; print(sys.executable)')"
          ${{ matrix.configure }}

      - name: Build (Debug)
        run: cmake --build build --config Debug

      # tar keeps the executable bits; object files are not needed to run
      # the tests.
      - name: Pack build tree
        run: >
          tar -czf build-${{ matrix.target }}.tgz
          --exclude='*.o' --exclude='*.obj' --exclude='*.pdb'
          --exclude='*.ilk' --exclude='*.idb' --exclude='*.tlog'
          build

      - name: Upload build tree
        uses: actions/upload-artifact@v7
        with:
          name: build-${{ matrix.target }}
          path: build-${{ matrix.target }}.tgz
          if-no-files-found: error
          retention-days: 1

  test:
    name: test ${{ matrix.target }}
    needs: build
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: linux-x64
            runner: ubuntu-latest
            robot: true
          - target: macos-arm64
            runner: macos-latest
            robot: true
          - target: macos-arm64-asan
            runner: macos-latest
            robot: true
          - target: windows-x64
            runner: windows-latest
            robot: false
    defaults:
      run:
        shell: bash
    env:
      # LeakSanitizer is not reliably supported on macOS runners.
      ASAN_OPTIONS: "halt_on_error=1:detect_leaks=0"
      UBSAN_OPTIONS: "halt_on_error=1:print_stacktrace=1"
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Download prepared source
        uses: actions/download-artifact@v8
        with:
          name: ci-source
          path: ${{ runner.temp }}/ci-source

      - name: Use prepared source
        run: |
          git fetch --no-tags "$RUNNER_TEMP/ci-source/ci-source.bundle" HEAD
          git checkout --detach FETCH_HEAD

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install clangd (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --yes clangd

      # C# language server for the C# LSP integration test.
      - name: Set up .NET (Linux)
        if: runner.os == 'Linux'
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            9.0.x

      - name: Install csharp-ls (Linux)
        if: runner.os == 'Linux'
        run: |
          dotnet tool install --global csharp-ls
          echo "$HOME/.dotnet/tools" >> "$GITHUB_PATH"

      - name: Download build tree
        uses: actions/download-artifact@v8
        with:
          name: build-${{ matrix.target }}

      - name: Unpack build tree
        run: tar -xzf build-${{ matrix.target }}.tgz

      - name: Unit tests
        run: ctest --test-dir build -C Debug --output-on-failure

      - name: Robot tests
        if: matrix.robot
        run: |
          python3 -m venv .venv
          source .venv/bin/activate
          python -m pip install --upgrade pip
          python -m pip install -r tests/robot/requirements.txt
          UVIM_BIN="$PWD/build/uvim" ./tests/robot/run_robot.sh tests/robot/

  # ---------------------------------------------------------------------------
  # Artifacts: Release builds for the supported targets, x64 and arm64
  # (macOS: arm64). All run in parallel; each uploads its binary.
  # ---------------------------------------------------------------------------
  artifacts:
    name: artifacts ${{ matrix.target }}
    needs: prepare
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: linux-x64
            runner: ubuntu-latest
          - target: linux-arm64
            runner: ubuntu-24.04-arm
          - target: macos-arm64
            runner: macos-latest
          - target: windows-x64
            runner: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Download prepared source
        uses: actions/download-artifact@v8
        with:
          name: ci-source
          path: ${{ runner.temp }}/ci-source

      - name: Use prepared source
        shell: bash
        run: |
          git fetch --no-tags "$RUNNER_TEMP/ci-source/ci-source.bundle" HEAD
          git checkout --detach FETCH_HEAD

      - name: Install build tools (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --yes g++ ninja-build

      - name: Configure (Linux)
        if: runner.os == 'Linux'
        run: |
          cmake -S . -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DUVIM_BUILD_TESTS=OFF \
            -DUVIM_ENABLE_CLANGD_LSP=ON \
            -DUVIM_ENABLE_CSHARP_LSP=ON

      - name: Configure (macOS arm64)
        if: runner.os == 'macOS'
        run: |
          cmake -S . -B build \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_OSX_ARCHITECTURES=arm64 \
            -DUVIM_BUILD_TESTS=OFF \
            -DUVIM_ENABLE_CLANGD_LSP=ON \
            -DUVIM_ENABLE_CSHARP_LSP=ON

      - name: Configure (Windows x64)
        if: runner.os == 'Windows'
        run: >
          cmake -S . -B build -A x64
          -DUVIM_BUILD_TESTS=OFF
          -DUVIM_ENABLE_CLANGD_LSP=ON
          -DUVIM_ENABLE_CSHARP_LSP=ON

      - name: Build (Release)
        run: cmake --build build --config Release --target uvim

      - name: Package (Linux/macOS)
        if: runner.os != 'Windows'
        run: |
          mkdir -p dist
          tar -czf dist/uvim-${{ matrix.target }}.tar.gz -C build uvim

      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          Compress-Archive -Path build/Release/uvim.exe -DestinationPath dist/uvim-${{ matrix.target }}.zip

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: uvim-${{ matrix.target }}
          path: dist/*
          if-no-files-found: error
