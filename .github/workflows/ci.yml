name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

jobs:
  build-test:
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure
        run: |
          cmake -S . -B build \
            -DUVIM_BUILD_TESTS=ON \
            -DUVIM_ENABLE_CLANGD_LSP=OFF

      - name: Build
        run: cmake --build build

      - name: Unit tests
        run: ctest --test-dir build --output-on-failure

      - name: Robot tests
        run: |
          python3 -m venv .venv
          source .venv/bin/activate
          python -m pip install --upgrade pip
          python -m pip install -r tests/robot/requirements.txt
          UVIM_BIN="$PWD/build/uvim" ./tests/robot/run_robot.sh tests/robot/
