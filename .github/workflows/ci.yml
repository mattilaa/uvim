name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

jobs:
  # ---------------------------------------------------------------------------
  # Debug builds: only for running the tests.
  # ---------------------------------------------------------------------------
  test-linux-x64:
    name: test linux-x64 (Debug, GCC)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install --yes g++ ninja-build clangd

      - name: Configure (Debug, GCC)
        run: |
          cmake -S . -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Debug \
            -DCMAKE_CXX_COMPILER=g++ \
            -DUVIM_BUILD_TESTS=ON \
            -DUVIM_ENABLE_CLANGD_LSP=ON

      - name: Build (Debug)
        run: cmake --build build

      - name: Unit tests
        run: ctest --test-dir build --output-on-failure

      - name: Robot tests
        run: |
          python3 -m venv .venv
          source .venv/bin/activate
          python -m pip install --upgrade pip
          python -m pip install -r tests/robot/requirements.txt
          UVIM_BIN="$PWD/build/uvim" ./tests/robot/run_robot.sh tests/robot/

  test-macos-arm64:
    name: test macos-arm64 (Debug)
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Configure (Debug)
        run: |
          cmake -S . -B build \
            -DCMAKE_BUILD_TYPE=Debug \
            -DUVIM_BUILD_TESTS=ON \
            -DUVIM_ENABLE_CLANGD_LSP=OFF

      - name: Build (Debug)
        run: cmake --build build --parallel

      - name: Unit tests
        run: ctest --test-dir build --output-on-failure

      - name: Robot tests
        run: |
          python3 -m venv .venv
          source .venv/bin/activate
          python -m pip install --upgrade pip
          python -m pip install -r tests/robot/requirements.txt
          UVIM_BIN="$PWD/build/uvim" ./tests/robot/run_robot.sh tests/robot/

  test-macos-arm64-sanitizers:
    name: test macos-arm64 (Debug, ASan/UBSan)
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Configure (Debug + ASan/UBSan)
        run: |
          cmake -S . -B build-sanitizers \
            -DCMAKE_BUILD_TYPE=Debug \
            -DUVIM_BUILD_TESTS=ON \
            -DUVIM_ENABLE_CLANGD_LSP=OFF \
            -DUVIM_ENABLE_SANITIZERS=ON

      - name: Build (Debug + ASan/UBSan)
        run: cmake --build build-sanitizers

      - name: Sanity check (Debug + Sanitizers)
        run: |
          echo "=== Using sanitizer build dir ==="
          echo "PWD=$PWD"
          echo "BUILD_DIR=$PWD/build-sanitizers"
          echo
          echo "=== CMake cache (key settings) ==="
          grep -E '^(CMAKE_BUILD_TYPE:|UVIM_ENABLE_SANITIZERS:|CMAKE_C_COMPILER:|CMAKE_CXX_COMPILER:)' build-sanitizers/CMakeCache.txt || true
          echo
          echo "=== Check binary is instrumented (links ASan runtime) ==="
          if [ -f "build-sanitizers/uvim" ]; then
            otool -L build-sanitizers/uvim | grep -E 'asan' || echo "NOTE: did not find 'asan' in linked libs (unexpected if ASan is enabled)"
          else
            echo "ERROR: build-sanitizers/uvim not found"
            ls -la build-sanitizers || true
          fi
          echo
          echo "=== Robot will run this binary ==="
          echo "UVIM_BIN=$PWD/build-sanitizers/uvim"

      - name: Unit tests (ASan/UBSan)
        env:
          # LeakSanitizer is not reliably supported on macOS runners; avoid aborting the job.
          ASAN_OPTIONS: "halt_on_error=1:detect_leaks=0"
          UBSAN_OPTIONS: "halt_on_error=1:print_stacktrace=1"
        run: ctest --test-dir build-sanitizers --output-on-failure

      - name: Robot tests (ASan/UBSan)
        env:
          ASAN_OPTIONS: "halt_on_error=1:detect_leaks=0"
          UBSAN_OPTIONS: "halt_on_error=1:print_stacktrace=1"
        run: |
          python3 -m venv .venv
          source .venv/bin/activate
          python -m pip install --upgrade pip
          python -m pip install -r tests/robot/requirements.txt
          UVIM_BIN="$PWD/build-sanitizers/uvim" ./tests/robot/run_robot.sh tests/robot/

  test-windows-x64:
    name: test windows-x64 (Debug, MSVC)
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Configure (MSVC x64)
        run: >
          cmake -S . -B build -A x64
          -DUVIM_BUILD_TESTS=ON
          -DUVIM_ENABLE_CLANGD_LSP=ON

      - name: Build (Debug)
        run: cmake --build build --config Debug --parallel

      - name: Unit tests
        run: ctest --test-dir build -C Debug --output-on-failure

  # ---------------------------------------------------------------------------
  # Artifacts: Release builds for the supported targets, x64 and arm64
  # (macOS: arm64). All run in parallel; each uploads its binary.
  # ---------------------------------------------------------------------------
  artifacts:
    name: artifacts ${{ matrix.target }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: linux-x64
            runner: ubuntu-latest
          - target: linux-arm64
            runner: ubuntu-24.04-arm
          - target: macos-arm64
            runner: macos-latest
          - target: windows-x64
            runner: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install build tools (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --yes g++ ninja-build

      - name: Configure (Linux)
        if: runner.os == 'Linux'
        run: |
          cmake -S . -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DUVIM_BUILD_TESTS=OFF \
            -DUVIM_ENABLE_CLANGD_LSP=ON

      - name: Configure (macOS arm64)
        if: runner.os == 'macOS'
        run: |
          cmake -S . -B build \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_OSX_ARCHITECTURES=arm64 \
            -DUVIM_BUILD_TESTS=OFF \
            -DUVIM_ENABLE_CLANGD_LSP=ON

      - name: Configure (Windows x64)
        if: runner.os == 'Windows'
        run: >
          cmake -S . -B build -A x64
          -DUVIM_BUILD_TESTS=OFF
          -DUVIM_ENABLE_CLANGD_LSP=ON

      - name: Build (Release)
        run: cmake --build build --config Release --parallel --target uvim

      - name: Package (Linux/macOS)
        if: runner.os != 'Windows'
        run: |
          mkdir -p dist
          tar -czf dist/uvim-${{ matrix.target }}.tar.gz -C build uvim

      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          Compress-Archive -Path build/Release/uvim.exe -DestinationPath dist/uvim-${{ matrix.target }}.zip

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: uvim-${{ matrix.target }}
          path: dist/*
          if-no-files-found: error
